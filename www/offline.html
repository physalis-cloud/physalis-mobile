<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Physalis</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #e8590c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box; text-align: center;
    }
    main { max-width: 340px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 12px; padding: 12px 28px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Physalis est injoignable</h1>
    <p id="text">Vérifiez votre connexion à Internet, puis réessayez.</p>
    <button id="retry" type="button">Réessayer</button>
  </main>
  <script>
    // Langue de l'appareil : français par défaut, anglais et espagnol sinon.
    var l = (navigator.language || 'fr').slice(0, 2);
    var t = {
      en: ['Physalis is unreachable', 'Check your Internet connection, then try again.', 'Try again'],
      es: ['Physalis no está disponible', 'Compruebe su conexión a Internet y vuelva a intentarlo.', 'Reintentar'],
    }[l];
    if (t) {
      document.documentElement.lang = l;
      document.getElementById('title').textContent = t[0];
      document.getElementById('text').textContent = t[1];
      document.getElementById('retry').textContent = t[2];
    }
    document.getElementById('retry').addEventListener('click', function () {
      window.location.replace('https://vault.physalis.cloud');
    });
  </script>
</body>
</html>
