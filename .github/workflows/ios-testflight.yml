# Compile l'app iOS et l'envoie sur TestFlight, avec la clé d'API Apple
# détenue par Physalis lui-même : AUCUN secret GitHub.
#
# Le job présente son jeton OIDC à Physalis (mobile-actions/credentials) ; une
# policy mobile sur (ce dépôt, ce fichier, main) lui sert la clé d'API App Store
# Connect, le Team ID et le numéro de build de l'app cloud.physalis.app. Xcode
# signe ensuite automatiquement (certificat et profils créés par Apple), ce
# qui couvrira aussi l'extension de remplissage. La livraison est inscrite au
# registre de Physalis (mobile-actions/report).
#
# Dépôt public → minutes macOS gratuites (plan mots-de-passe-quotidien §5 bis).
name: iOS → TestFlight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "www/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  id-token: write   # jeton OIDC présenté à Physalis
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Clé d'API Apple, Team ID et numéro de build (Physalis, OIDC)
        uses: physalis-cloud/mobile-actions/credentials@v1
        with:
          app: cloud.physalis.app
          platform: ios
          signing: automatic

      - name: Xcode le plus récent
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: |
          npm ci
          brew install xcodegen

      # XcodeGen AVANT cap sync : cap sync lit le project.pbxproj.
      - name: Projet Xcode (XcodeGen), puis synchronisation Capacitor
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
        run: |
          (cd ios/App && xcodegen generate)
          npx cap sync ios

      - name: Archive signée
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Envoi sur TestFlight
        run: |
          plutil -replace teamID -string "$TEAM_ID" ios/ci/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Inscrit la livraison au registre de Physalis et efface la clé du runner.
      - uses: physalis-cloud/mobile-actions/report@v1
        if: always()
        with:
          track: testflight
          status: ${{ job.status == 'success' && 'uploaded' || 'failed' }}
